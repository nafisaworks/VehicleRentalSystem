
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>My Vehicles</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="customer-dashboard.html">Customer</a>
        <a href="owner-dashboard.html">Owner</a>
    </nav>
</header>

<main>
    <section class="dashboard">
        <h2>My Listed Vehicles</h2>
        <p class="dashboard-subtitle">
            View the vehicles listed under your owner account.
        </p>
        <p id="status" role="status">Loading your vehicles...</p>
        <div id="owner-vehicle-container" class="vehicle-grid"></div>
    </section>
</main>

<script>
const API = "http://127.0.0.1:5000";
const vehicleContainer = document.getElementById("owner-vehicle-container");
const status = document.getElementById("status");

async function loadMyVehicles() {
    try {
        const response = await fetch(`${API}/owner-vehicles`, {
            credentials: "include"
        });

        const data = await response.json();

        if (!response.ok) {
            status.textContent = data.error || "Please log in with your owner account.";
            return;
        }

        if (!Array.isArray(data) || data.length === 0) {
            status.textContent = "You haven't listed any vehicles yet.";
            return;
        }

        status.textContent = "";

        data.forEach(vehicle => {
            const card = document.createElement("div");
            card.className = "vehicle-card";

            const details = [
                ["Registration", vehicle.registration_no],
                ["Location", vehicle.location],
                ["Price per day", `₹${vehicle.price_per_day}`],
                ["Model Year", vehicle.model_year],
                ["Condition", vehicle.condition_description],
                ["Availability", vehicle.availability_status],
                ["Listing Verification", vehicle.verification_status || "Pending"],
                ["Commercial Eligibility", vehicle.commercial_eligibility_status || "Pending"],
                ["Commercial Use Declared", vehicle.commercial_use_declared ? "Yes" : "No"],
                ["Permit Number", vehicle.permit_number],
                ["Permit Expiry", vehicle.permit_expiry_date],
                ["Insurance Expiry", vehicle.insurance_expiry_date]
            ];

            const heading = document.createElement("h3");
            heading.textContent = vehicle.vehicle_name;
            card.appendChild(heading);

            details.forEach(([label, value]) => {
                const p = document.createElement("p");
                const strong = document.createElement("strong");
                strong.textContent = `${label}: `;
                p.append(strong, document.createTextNode(
                    value === null || value === undefined || value === ""
                        ? "Not provided"
                        : String(value)
                ));
                card.appendChild(p);
            });

            vehicleContainer.appendChild(card);
        });
    } catch (error) {
        console.error("Unable to load vehicles:", error);
        status.textContent =
            "Unable to load vehicles. Check that the backend is running.";
    }
}

loadMyVehicles();
</script>
</body>
</html>
