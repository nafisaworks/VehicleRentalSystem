<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login | Peer2Rent</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Peer2Rent</h1><nav><a href="index.html">Home</a><a href="vehicles.html">Browse Vehicles</a><a class="active" href="customer-auth.html">Log In</a></nav></header><main class="dashboard"><div class="eyebrow">Welcome back</div><h2>Good to have you back.</h2><p class="dashboard-subtitle">Sign in to continue to your bookings and account.</p><form id="login-form" class="dashboard-card"><div class="form-field"><label for="login-email">Email address</label><input id="login-email" type="email" required autocomplete="email" maxlength="100" placeholder="you@example.com"></div><div class="form-field"><label for="login-password">Password</label><input id="login-password" type="password" required autocomplete="current-password" placeholder="Enter your password"></div><button type="submit">Log in to Peer2Rent</button><p id="login-message" role="status"></p><p class="muted">New to Peer2Rent? <a href="customer-register.html"><strong>Create an account</strong></a></p></form></main><footer><strong>Peer2Rent</strong><span>Your next drive starts here.</span></footer><script>
const API="http://127.0.0.1:5000";
document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('login-message');m.textContent='Signing you in…';try{const r=await fetch(API+'/customer/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('login-email').value,password:document.getElementById('login-password').value})});const d=await r.json();if(!r.ok){m.textContent=d.error||'Unable to log in.';return;}window.location.href='customer-dashboard.html';}catch(err){m.textContent='Cannot connect to the server. Please check that Flask is running.';}});
</script></body></html>
