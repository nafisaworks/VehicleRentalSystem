<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Peer2Rent</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Peer2Rent</h1><nav><a href="index.html">Home</a><a href="vehicles.html">Browse Vehicles</a><a class="active" href="customer-register.html">Create Account</a></nav></header><main class="dashboard"><div class="eyebrow">Your journey starts here</div><h2>Create your account.</h2><p class="dashboard-subtitle">A few details, then you're ready to explore and book.</p><form id="register-form" class="dashboard-card"><div class="form-grid"><div class="form-field"><label for="customer-name">Full name</label><input id="customer-name" type="text" required maxlength="100" autocomplete="name" placeholder="Your full name"></div><div class="form-field"><label for="register-email">Email address</label><input id="register-email" type="email" required maxlength="100" autocomplete="email" placeholder="you@example.com"></div><div class="form-field"><label for="customer-phone">Phone number</label><input id="customer-phone" type="tel" required maxlength="15" autocomplete="tel" placeholder="Phone number"></div><div class="form-field"><label for="customer-address">Address <span class="muted">(optional)</span></label><input id="customer-address" type="text" maxlength="255" autocomplete="street-address" placeholder="Your address"></div><div class="form-field full"><label for="register-password">Create password</label><input id="register-password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="At least 8 characters"><p class="muted">Use a unique password with at least 8 characters.</p></div></div><button type="submit">Create account</button><p id="register-message" role="status"></p><p class="muted">Already registered? <a href="customer-auth.html"><strong>Log in</strong></a></p></form></main><footer><strong>Peer2Rent</strong><span>Your next drive starts here.</span></footer><script>
const API="http://127.0.0.1:5000";
document.getElementById('register-form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('register-message');m.textContent='Creating your account…';try{const r=await fetch(API+'/customer/register',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_name:document.getElementById('customer-name').value,email:document.getElementById('register-email').value,phone:document.getElementById('customer-phone').value,address:document.getElementById('customer-address').value,password:document.getElementById('register-password').value})});const d=await r.json();if(!r.ok){m.textContent=d.error||'Unable to create account.';return;}window.location.href='customer-dashboard.html';}catch(err){m.textContent='Cannot connect to the server. Please check that Flask is running.';}});
</script></body></html>
