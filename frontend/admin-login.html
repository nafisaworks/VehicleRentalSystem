<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Peer2Rent</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>Peer2Rent</h1><nav><a href="index.html">Home</a><a href="vehicles.html">Browse Vehicles</a><a href="customer-auth.html">Customer Login</a><a class="active" href="admin-login.html">Admin Login</a></nav></header>
<main class="dashboard"><div class="eyebrow">Administrator access</div><h2>Welcome back.</h2><p class="dashboard-subtitle">Sign in to review vehicle submissions and manage approvals.</p>
<form id="admin-login-form" class="dashboard-card"><div class="form-field"><label for="admin-email">Admin email</label><input id="admin-email" type="email" required autocomplete="username" maxlength="100" placeholder="admin@example.com"></div><div class="form-field"><label for="admin-password">Password</label><input id="admin-password" type="password" required autocomplete="current-password" placeholder="Enter your password"></div><button type="submit">Log in to Admin</button><p id="admin-message" role="status" aria-live="polite"></p><p class="muted">Customer? <a href="customer-auth.html"><strong>Go to customer login</strong></a></p></form></main>
<footer><strong>Peer2Rent</strong><span>Secure vehicle review and management.</span></footer>
<script>
const API='http://127.0.0.1:5000';
document.getElementById('admin-login-form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('admin-message');m.textContent='Signing you in…';try{const r=await fetch(API+'/admin/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('admin-email').value.trim(),password:document.getElementById('admin-password').value})});let d={};try{d=await r.json()}catch{}if(!r.ok){m.textContent=d.error||'Unable to log in. Check your credentials and try again.';return;}window.location.href='admin-dashboard.html';}catch(err){m.textContent='Cannot connect to the server. Check that Flask is running.';}});
</script></body></html>
