
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rental Requests</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Rental Requests</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="owner-dashboard.html">Owner Dashboard</a>
        <a href="owner-vehicles.html">My Vehicles</a>
    </nav>
</header>

<main>
    <section class="dashboard">
        <h2>Bookings for My Vehicles</h2>
        <p class="dashboard-subtitle">
            View rental requests for your vehicles.
        </p>

        <p id="message" role="status">Loading rental requests...</p>
        <div id="requests" class="vehicle-grid"></div>
    </section>
</main>

<script>
const API = "http://127.0.0.1:5000";
const requests = document.getElementById("requests");
const message = document.getElementById("message");

async function loadMyBookings() {
    requests.innerHTML = "";

    try {
        const response = await fetch(`${API}/owner-bookings`, {
            credentials: "include"
        });

        const bookings = await response.json();

        if (!response.ok) {
            message.textContent =
                bookings.error || "Please log in with your owner account.";
            return;
        }

        if (!Array.isArray(bookings) || bookings.length === 0) {
            message.textContent = "You don't have any rental requests yet.";
            return;
        }

        message.textContent = "";

        bookings.forEach(booking => {
            const card = document.createElement("div");
            card.className = "vehicle-card";

            const title = document.createElement("h3");
            title.textContent =
                `${booking.vehicle_name} — Booking #${booking.booking_id}`;
            card.appendChild(title);

            const details = [
                ["Registration", booking.registration_no],
                ["Customer ID", booking.customer_id],
                ["Start date", booking.start_date],
                ["End date", booking.end_date],
                [
                    "Total amount",
                    `₹${Number(booking.total_amount).toLocaleString("en-IN")}`
                ],
                ["Booking status", booking.booking_status]
            ];

            details.forEach(([label, value]) => {
                const p = document.createElement("p");
                const strong = document.createElement("strong");

                strong.textContent = `${label}: `;
                p.append(strong, document.createTextNode(value ?? "—"));
                card.appendChild(p);
            });

            requests.appendChild(card);
        });
    } catch (error) {
        console.error("Could not load owner bookings:", error);
        message.textContent =
            "Unable to load rental requests. Check that the backend is running.";
    }
}

loadMyBookings();
</script>

</body>
</html>
